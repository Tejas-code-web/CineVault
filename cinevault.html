<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault</title>
    <link rel="stylesheet" href="cinevault.css">
    <script src="cinevault.js" defer></script>
</head>
<body>
    <nav>
        <h1>CineVault</h1>
        <a href="#">Home</a>
        <a href="#">Favourites</a>
    </nav>
    <main id="moviesection">
        <section id="searchcontainer">
            <h1 id="tagline"></h1>
            <input type="text" id="movie" placeholder="Enter a movie">
            <button id="searchbtn">Search</button>
            <p id="description"></p>
        </section>
        <section id="filters">
            <ul id="list">
                <li>Trending</li>
                <li>Popular</li>
                <li>Top Rated</li>
                <li>Upcoming</li>
            </ul>
        </section>
        <section id="result"></section>
        <section id="details"></section>
        <section id="favsec"></section>
        <p id="error"></p>
    </main>
    <footer id="foot">
        <p>&copy; CineVault||All Rights Reserved||2026</p>
    </footer>
</body>
</html>
